<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!--
      favicon.png é o símbolo recortado de logo-wishbone.webp,
      o mesmo do Sistema de Orçamentos.
    -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wishbone | Controle de Produção</title>

    <!-- Inter, mesma fonte e mesmos pesos do Sistema de Orçamentos -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!--
      Tema aplicado ANTES do React montar: sem isto quem usa o
      escuro leva um flash branco a cada F5. Bloqueante de
      propósito, são milissegundos. Mesma chave do orçamento.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("wishbone:tema");

          var dark =
            saved === "escuro" ||
            ((!saved || saved === "sistema") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);

          if (dark) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          /* Armazenamento bloqueado: fica no claro. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
